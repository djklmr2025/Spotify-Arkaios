<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="25%" stop-color="#0e172a"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="42%" stop-color="#8b5cf6"/>
      <stop offset="68%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Cover Plate -->
  <rect width="500" height="500" fill="#090d16" rx="28"/>
  <rect x="12" y="12" width="476" height="476" fill="none" stroke="#1e293b" stroke-width="2" rx="20"/>

  <!-- CD Vinyl Disc Body -->
  <circle cx="250" cy="250" r="208" fill="url(#discGrad)" stroke="url(#neonBorder)" stroke-width="5" filter="url(#glow)"/>
  
  <!-- Holographic Audio Grooves -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.7"/>
  <circle cx="250" cy="250" r="150" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <circle cx="250" cy="250" r="125" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="250" cy="250" r="100" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.4"/>

  <!-- Center Hub Label -->
  <circle cx="250" cy="250" r="72" fill="#090d16" stroke="url(#neonBorder)" stroke-width="3.5"/>
  <circle cx="250" cy="250" r="30" fill="#030712" stroke="#00f2fe" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="14" fill="#000000"/>

  <!-- Typography: Header & Footer -->
  <text x="250" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="5">CD-TRCKAS</text>
  <text x="250" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">EDICIÓN OFICIAL • 28 TRACKS MASTER</text>
  <text x="250" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="4">ARKAIOS AUDIO NETWORK</text>
  <text x="250" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">DJ KLMR • FLAC / MP3 HQ</text>
</svg>
